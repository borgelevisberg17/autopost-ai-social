<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 42">
  <g fill="none" fill-rule="evenodd">
    <!-- Bank Pillar Icon -->
    <g transform="translate(2, 6)" fill="#002133">
      <!-- Roof pediment -->
      <polygon points="14,0 0,7 28,7"/>
      <!-- Architrave -->
      <rect x="1" y="8" width="26" height="2" rx="0.5"/>
      <!-- 4 Pillars -->
      <rect x="3" y="11" width="3.5" height="12" rx="0.5"/>
      <rect x="9.5" y="11" width="3.5" height="12" rx="0.5"/>
      <rect x="15" y="11" width="3.5" height="12" rx="0.5"/>
      <rect x="21.5" y="11" width="3.5" height="12" rx="0.5"/>
      <!-- Base plinth -->
      <rect x="0" y="24" width="28" height="3" rx="0.5"/>
      <rect x="2" y="27.5" width="24" height="2" rx="0.5"/>
    </g>
    <!-- IBAN and Transferência text -->
    <text x="36" y="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#002133" letter-spacing="0.5">IBAN</text>
    <text x="36" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0070BA" letter-spacing="0.2">TRANSFERÊNCIA</text>
  </g>
</svg>